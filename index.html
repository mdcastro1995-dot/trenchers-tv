<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trenchers TV</title>
<meta name="description" content="Shareable demo of Trenchers TV: crypto-meme short dramas in Reels and TV modes, channels, feed and memberships.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* Trenchers TV: estetica "streaming limpio" (ReelShort / Netflix). El video manda: fondo negro, texto blanco,
   grises para lo secundario y un solo acento rojo para la accion principal y el progreso.
   Sin recuadros, contornos, glow ni vidrio; esquinas chicas (4-8px); jerarquia por tamano y peso, no por cajas. */
:root {
  --bg: #000;
  --surface: #141414;
  --surface-2: #1f1f1f;
  --hair: #2a2a2a;
  --text: #fff;
  --soft: #cfcfcf;
  --muted: #9a9a9a;
  --red: #ff3b30;
  --font: 'Inter Tight', system-ui, -apple-system, sans-serif;
  --header: 64px;
  --tape: 0px;
  --reel-h: calc(100dvh - var(--header));
  --pad: 16px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: var(--font); font-weight: 400; -webkit-font-smoothing: antialiased; overflow: hidden; }
body[data-view="discover"], body[data-view="tv"], body[data-view="following"], body[data-view="channel"] { overflow: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
svg { width: 100%; height: 100%; display: block; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---------- Header ---------- */
.topbar {
  position: fixed; inset: 0 0 auto; z-index: 20; height: var(--header);
  display: flex; align-items: center; gap: 28px; padding: 0 var(--pad);
  background: linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.6) 70%, rgba(0,0,0,0));
}
body[data-view="discover"] .topbar, body[data-view="tv"] .topbar, body[data-view="following"] .topbar, body[data-view="channel"] .topbar { background: #000; }
.brand { display: flex; align-items: center; font-weight: 800; font-size: 19px; letter-spacing: -.4px; text-transform: uppercase; }
.brand img { display: none; }
.brand em { font-style: normal; color: var(--red); }
.tabs { display: flex; gap: 22px; }
.tabs a { position: relative; font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; transition: color .15s; }
.tabs a:hover { color: var(--soft); }
.tabs a.on { color: var(--text); }
.wallet { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.coins { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
.topup { padding: 8px 16px; border-radius: 4px; font-weight: 700; font-size: 14px; background: var(--red); color: #fff; }
.topup:hover { background: #ff5247; }
.account { padding: 8px 16px; border-radius: 4px; font-weight: 700; font-size: 14px; background: #fff; color: #000; white-space: nowrap; }
.account.signed-in, .avatar {
  width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 4px;
  font-weight: 800; font-size: 15px; background: var(--red); color: #fff;
}
.vip-badge { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--muted); }

/* Moneda TRENCH: un punto blanco con la T, discreto. */
.coin {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; vertical-align: -2px; flex: none;
  background: var(--text);
}
.coin::after { content: 'T'; font: 800 9px/1 var(--font); color: #000; font-style: normal; }
i.coin { margin-right: 4px; }
.coin.big { width: 40px; height: 40px; }
.coin.big::after { font-size: 20px; }

main { padding-top: var(--header); }
.ticker-tape { display: none; }
.up { color: var(--text); }
.down { color: var(--red); }

/* ---------- Reel vertical ---------- */
/* En el telefono el reel ocupa toda la pantalla y el header flota encima. */
body[data-view="feed"] main, body[data-view="watch"] main { padding-top: 0; }
body[data-view="feed"], body[data-view="watch"] { --reel-h: 100dvh; }
.reel-layout { display: flex; justify-content: center; }
.reel {
  height: var(--reel-h); width: 100%;
  overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
}
.reel::-webkit-scrollbar { display: none; }
.slide { position: relative; height: var(--reel-h); scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; }
.slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide::after {
  content: ''; position: absolute; inset: auto 0 0; height: 55%; pointer-events: none;
  background: linear-gradient(transparent, rgba(0,0,0,.92));
}
.tap-zone { position: absolute; inset: 0; z-index: 1; }
.big-play {
  position: absolute; z-index: 2; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; padding: 20px 18px 20px 24px;
  border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; pointer-events: none; opacity: 0; transition: opacity .15s;
}
.slide.paused:not(.locked) .big-play { opacity: 1; }
.progress { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.2); }
.progress i { display: block; height: 100%; width: 0; background: var(--red); }

.sound-hint {
  position: absolute; z-index: 4; top: calc(var(--header) + 8px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 10px; border-radius: 999px; white-space: nowrap;
  background: rgba(0,0,0,.6); font-size: 13px; font-weight: 600;
}
.sound-hint svg { width: 16px; height: 16px; }

.slide-info { position: absolute; z-index: 3; left: var(--pad); right: 80px; bottom: 28px; color: var(--text); }
.slide-info h2 { margin: 4px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.05; letter-spacing: -.5px; }
.slide-info .tags { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.slide-info .synopsis { margin: 0 0 16px; font-size: 14px; line-height: 1.4; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slide-info.compact h2 { font-size: 20px; }
.ep-line { margin: 0; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); font-size: 13px; font-weight: 600; }

.chip { display: inline-block; margin-right: 10px; font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.chip.hot { color: var(--red); }
.chip.ticker { color: var(--text); }

.watch-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px 11px 18px; border-radius: 4px;
  font-size: 15px; font-weight: 700; color: #000; background: #fff; transition: background .15s;
}
.watch-btn:hover { background: #e2e2e2; }
.watch-btn svg { width: 18px; height: 18px; }
.watch-btn.light { background: #fff; }

.rail { position: absolute; z-index: 3; right: 8px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
.rail-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px; font-size: 11px; font-weight: 600; color: var(--text); }
.rail-btn svg { width: 30px; height: 30px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.rail-btn.on svg { color: var(--red); }
.rail-btn.mute-btn { width: 40px; height: 40px; padding: 9px; border-radius: 50%; color: #fff; background: rgba(0,0,0,.45); }
.rail-btn.mute-btn svg { width: 100%; height: 100%; filter: none; }

/* Candado: video oscurecido y el aviso en texto, sin tarjeta. */
.lock-layer { display: none; position: absolute; inset: 0; z-index: 5; place-items: center; background: rgba(0,0,0,.78); backdrop-filter: blur(18px); }
.slide.locked .lock-layer { display: grid; }
.slide.locked .sound-hint, .slide.locked .progress { display: none; }
.lock-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 24px; max-width: 320px; }
.lock-icon { width: 36px; height: 36px; color: #fff; margin-bottom: 6px; }
.lock-card b { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
.lock-card span { color: var(--soft); font-size: 14px; }
.primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  padding: 11px 24px; border-radius: 4px; font-weight: 700; font-size: 15px; color: #fff; background: var(--red); transition: background .15s;
}
.primary:not(:disabled):hover { background: #ff5247; }
.primary:disabled { opacity: .4; cursor: not-allowed; }
.lock-card .primary { margin-top: 10px; min-width: 200px; }

/* ---------- Pagina de episodio ---------- */
.back-btn { display: none; }
.side-panel { display: none; }

/* ---------- Discover ---------- */
.discover { padding: 0 0 56px; }
.hero { position: relative; display: flex; align-items: flex-end; overflow: hidden; min-height: 78vh; background: #000; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, #000 4%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.1) 75%), linear-gradient(to right, rgba(0,0,0,.6), transparent 70%);
}
.hero-body { position: relative; z-index: 1; padding: 0 var(--pad) 32px; max-width: 620px; }
.hero-tags { display: flex; gap: 0; flex-wrap: wrap; }
.hero h1 { margin: 10px 0 12px; font-size: clamp(38px, 6vw, 68px); font-weight: 800; line-height: .98; letter-spacing: -1.6px; }
.hero p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: var(--soft); max-width: 480px; }
.shelf-title { display: block; margin: 34px var(--pad) 12px; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.shelf { display: flex; gap: 10px; align-items: flex-start; padding: 0 var(--pad) 6px; overflow-x: auto; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.poster { position: relative; flex: none; width: 140px; }
.poster img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; display: block; transition: opacity .15s; background: var(--surface); }
.poster:hover img { opacity: .8; }
.poster.wide { width: 250px; }
.poster.wide img { aspect-ratio: 16 / 9; }
.poster .lock-mini { top: 6px; right: 6px; }
.poster b { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep-badge { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.75); }
.demo-foot { margin: 48px var(--pad) 0; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.demo-foot button { font-weight: 600; color: var(--soft); text-decoration: underline; }

/* ---------- Modo TV ---------- */
.tv-player { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; background: var(--surface); }
.tv-player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tv-player.paused:not(.locked) .big-play { opacity: 1; }
.tv-player:fullscreen { border-radius: 0; }
.tv-player:fullscreen video { object-fit: contain; }
.tv-controls {
  position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
  padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.8));
}
.tv-btn { width: 32px; height: 32px; padding: 6px; flex: none; color: #fff; }
.tv-seek { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; cursor: pointer; }
.tv-seek i { display: block; height: 100%; width: 0; background: var(--red); }
.tv-time { color: var(--soft); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tv-lock { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(0,0,0,.78); backdrop-filter: blur(18px); }
.tv-lock[hidden] { display: none; }
.tv-player.locked .tv-controls { display: none; }

.tv-hero { display: flex; flex-direction: column; gap: 20px; padding: 12px var(--pad) 20px; background: #000; }
.tv-hero-info h1 { margin: 10px 0 12px; font-size: clamp(34px, 4.6vw, 60px); font-weight: 800; line-height: .98; letter-spacing: -1.4px; }
.tv-hero-info p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: var(--soft); max-width: 480px; }
.tv-home { padding-bottom: 56px; }

.tv-watch { padding: 12px var(--pad) 40px; }
.tv-meta { padding: 18px 0 0; }
.tv-meta h1 { margin: 6px 0 12px; font-size: 28px; font-weight: 800; line-height: 1.05; letter-spacing: -.6px; }
.tv-meta .synopsis { margin: 0; line-height: 1.55; font-size: 15px; color: var(--soft); }
.tv-meta .tag-row { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 12px; }
.tv-actions { display: flex; gap: 8px; margin-bottom: 14px; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 4px; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.12); }
.pill-btn:hover { background: rgba(255,255,255,.2); }
.pill-btn svg { width: 16px; height: 16px; }
.pill-btn.on svg { color: var(--red); }
.tv-list { margin-top: 28px; }
.tv-list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.tv-list-head b { font-size: 18px; font-weight: 700; }
.tv-ep {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 8px; text-align: left;
  border-radius: 6px; transition: background .15s;
}
.tv-ep:hover { background: var(--surface); }
.tv-ep.current { background: var(--surface-2); }
.tv-ep-thumb { position: relative; flex: none; width: 132px; aspect-ratio: 16 / 9; }
.tv-ep-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; background: var(--surface); }
.tv-ep.is-locked .tv-ep-thumb img { filter: brightness(.5); }
.tv-ep-thumb .eq { right: 6px; bottom: 6px; }
.tv-ep-text { min-width: 0; }
.tv-ep-text b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.tv-ep-text small { font-size: 12px; color: var(--muted); }

/* ---------- Grilla de episodios ---------- */
.grid-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.ranges { display: flex; gap: 14px; }
.ranges button { font-weight: 600; font-size: 14px; color: var(--muted); }
.ranges button.on { color: var(--text); }
.grid-note { color: var(--muted); font-size: 12px; }
.ep-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.ep-cell {
  position: relative; aspect-ratio: 1.2; border-radius: 4px; background: var(--surface);
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background .15s;
}
.ep-cell:hover { background: var(--surface-2); }
.ep-cell.seen { color: var(--muted); }
.ep-cell.is-locked { color: #5a5a5a; }
.ep-cell.current { color: #000; background: #fff; }
.lock-mini { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; padding: 0; color: var(--muted); }
.ep-cell.current .lock-mini { color: #000; }
.eq { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 2px; align-items: flex-end; height: 10px; }
.eq i { width: 3px; background: var(--red); animation: eq .8s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.3s; }
.eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { from { height: 3px; } to { height: 10px; } }

/* ---------- Modales ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.7); animation: fade .15s; }
.modal {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto;
  padding: 22px var(--pad) calc(22px + env(safe-area-inset-bottom)); background: var(--surface);
  border-radius: 12px 12px 0 0; animation: rise .22s cubic-bezier(.2, .8, .2, 1);
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.icon-btn { width: 32px; height: 32px; padding: 7px; border-radius: 50%; background: var(--surface-2); margin-left: auto; flex: none; }
.icon-btn:hover { background: #2c2c2c; }

.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.sheet-head img { width: 42px; height: 63px; border-radius: 3px; object-fit: cover; }
.sheet-head b { font-size: 17px; font-weight: 700; }
.sheet-head span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

.store-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); font-size: 14px; color: var(--muted); }
.store-head b { color: var(--text); margin-left: 4px; font-weight: 700; }
.store-head .sep { width: 1px; height: 14px; background: var(--hair); }
.store h4 { margin: 24px 0 2px; font-size: 18px; font-weight: 700; }
.store .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.store h4 + .coin-grid { margin-top: 14px; }
.unlock-box {
  margin-top: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  border-radius: 6px; background: var(--surface-2);
}
.unlock-box b { font-weight: 700; }
.unlock-box span { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); }
.unlock-box.short b { color: var(--red); }

.vip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vip-card {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; text-align: left;
  border-radius: 6px; background: var(--surface-2); transition: background .15s;
}
.vip-card:hover, .coin-card:hover { background: #2c2c2c; }
.vip-card b { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
.vip-name { font-weight: 600; font-size: 13px; color: var(--muted); }
.vip-note { font-size: 12px; color: var(--muted); }

.coin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.coin-card {
  position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden;
  border-radius: 6px; background: var(--surface-2); transition: background .15s;
}
.coin-stack { padding: 20px 0 10px; }
.coin-amt { font-weight: 700; font-size: 15px; padding-bottom: 12px; font-variant-numeric: tabular-nums; }
.coin-amt em { font-style: normal; color: var(--muted); font-weight: 500; }
.coin-price { width: 100%; padding: 9px 0; border-top: 1px solid var(--hair); font-weight: 700; }
.badge { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--red); }
.test-note { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

/* Cuenta */
.auth-head { display: flex; align-items: center; margin-bottom: 14px; }
.auth-head img { display: none; }
.auth h3 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1.05; word-break: break-all; }
.auth .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--soft); }
.auth-form input {
  padding: 13px 14px; border: 1px solid var(--hair); border-radius: 4px; background: #000; color: var(--text); font: 500 16px var(--font);
}
.auth-form input:focus { outline: none; border-color: var(--muted); }
.form-error { margin: 0; min-height: 18px; color: var(--red); font-size: 13px; }
.auth-form .primary { margin-top: 4px; }
.switch { margin: 16px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
.switch button { color: var(--text); font-weight: 600; text-decoration: underline; }
.account-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.account-stats div { padding: 12px; border-radius: 6px; background: var(--surface-2); }
.account-stats dt { font-size: 12px; color: var(--muted); }
.account-stats dd { margin: 4px 0 0; font-weight: 700; font-size: 15px; }
.account-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { padding: 11px 18px; border-radius: 4px; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.12); }
.ghost:hover { background: rgba(255,255,255,.2); }

#toast {
  position: fixed; z-index: 60; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  padding: 11px 18px; border-radius: 4px; background: #fff; color: #000;
  font-weight: 600; font-size: 14px; transition: .2s; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Canales, membresias y feed ---------- */
.tab-badge {
  position: absolute; top: -2px; right: -10px; width: 7px; height: 7px; padding: 0; overflow: hidden;
  border-radius: 50%; font-size: 0; background: var(--red);
}
.by { display: inline-block; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.by:hover { color: var(--text); }

.tier-host { padding: 0 var(--pad); }
.tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.tier-card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 6px; background: var(--surface); }

.tier-card .primary, .tier-card .chip { margin-top: auto; align-self: flex-start; }
.tier-card .primary { background: #fff; color: #000; }
.tier-card .primary:not(:disabled):hover { background: #e2e2e2; }

.feed-page { padding: 28px var(--pad) 56px; }
.feed-wrap, .feed-empty { max-width: 760px; margin: 0 auto; }
.feed-page h1 { margin: 0 0 16px; font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; line-height: 1; letter-spacing: -1px; }
.feed-empty p { font-size: 16px; color: var(--soft); margin: 0 0 18px; }
.following { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 18px; scrollbar-width: none; }
.ch-chip { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 4px 14px 4px 4px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface); white-space: nowrap; }
.ch-chip:hover { background: var(--surface-2); }
.ch-chip.add { padding: 6px 14px; color: var(--muted); }
.feed-list { display: flex; flex-direction: column; }
.feed-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); transition: opacity .15s; }
.feed-item:hover { opacity: .8; }
.feed-item.is-new .feed-body b::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--red); vertical-align: middle; }
.feed-thumb { position: relative; flex: none; width: 72px; aspect-ratio: 2 / 3; }

.feed-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; background: var(--surface); }
.feed-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feed-ch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.feed-body b { font-size: 16px; font-weight: 700; line-height: 1.2; }
.feed-ep { font-size: 14px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-tags { display: flex; gap: 0; flex-wrap: wrap; }

.tv-yt { position: absolute; inset: 0; z-index: 4; background: #000; }
.tv-yt iframe { width: 100%; height: 100%; border: 0; display: block; }
.tv-player.external .tv-controls, .tv-player.external .big-play, .tv-player.external .tap-zone { display: none; }

.account-subs { margin: 6px 0 16px; }
.account-subs h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.account-subs .sub { margin: 8px 0 0; }
.account-subs .sub a { text-decoration: underline; }
.ch-row { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 6px; border-radius: 6px; background: var(--surface-2); }

/* ---------- Telefono ---------- */

/* ---------- Escritorio ---------- */
@media (min-width: 900px) {
  :root { --pad: 48px; }
  .topbar { padding: 0 var(--pad); }
  /* El video es una tarjeta 9:16 centrada sobre negro; los botones van afuera, a la derecha. */
  body[data-view="feed"], body[data-view="watch"] { --reel-h: calc(100dvh - var(--header)); }
  body[data-view="feed"] main, body[data-view="watch"] main { padding-top: var(--header); }
  .reel-layout .reel, .watch-reel { width: calc(var(--reel-h) * 9 / 16 + 80px); }
  .slide { background: transparent; padding: 8px 0 16px; }
  .slide video { inset: 8px auto 16px 0; width: calc(100% - 80px); height: calc(100% - 24px); border-radius: 8px; background: var(--surface); }
  .slide::after { right: 80px; bottom: 16px; border-radius: 0 0 8px 8px; }
  .slide .progress { right: 80px; left: 0; bottom: 16px; border-radius: 0 0 8px 8px; overflow: hidden; }
  .lock-layer { inset: 8px 80px 16px 0; border-radius: 8px; }
  .slide .tap-zone { right: 80px; }
  .big-play { left: calc(50% - 40px); }
  .sound-hint { top: 24px; left: calc(50% - 40px); }
  .slide-info { left: 18px; right: 98px; bottom: 34px; }
  .rail { right: 6px; bottom: 40px; }

  .watch { display: flex; justify-content: center; gap: 48px; padding-left: 80px; }
  .back-btn {
    display: block; position: fixed; z-index: 5; left: var(--pad); top: calc(var(--header) + 20px);
    width: 40px; height: 40px; padding: 9px; border-radius: 50%; background: var(--surface-2);
  }
  .watch .rail-btn[data-action="episodes"] { display: none; }
  .side-panel { display: block; width: 440px; height: var(--reel-h); overflow-y: auto; padding: 24px 6px 30px 0; scrollbar-width: thin; }
  .crumbs { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  .crumbs a:hover { color: var(--text); }
  .side-panel h1 { margin: 8px 0 12px; font-size: 34px; font-weight: 800; line-height: 1.02; letter-spacing: -.8px; }
  .side-panel .synopsis { margin: 0 0 16px; line-height: 1.55; font-size: 15px; color: var(--soft); }
  .tag-row { display: flex; gap: 0; flex-wrap: wrap; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--hair); }

  .modal {
    left: 50%; right: auto; bottom: auto; top: 50%; width: min(760px, calc(100vw - 48px)); max-height: 88vh;
    transform: translate(-50%, -50%); border-radius: 10px; padding: 26px 28px; animation: pop .18s ease-out;
  }
  .modal.sheet { width: 500px; }
  .modal.auth { width: 420px; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } }

  .tv-hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: center; gap: 48px; padding: 24px var(--pad) 32px; }
  .tv-watch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; padding: 20px var(--pad) 40px; }
  .tv-list { margin-top: 0; max-height: calc(var(--reel-h) - 40px); overflow-y: auto; padding-right: 6px; position: sticky; top: calc(var(--header) + 20px); scrollbar-width: thin; }
  .tv-meta h1 { font-size: 34px; }
  .poster.wide { width: 290px; }
  .poster { width: 170px; }
  .ch-hero { padding: 44px var(--pad) 40px; gap: 28px; }
  .hero { min-height: 82vh; align-items: flex-end; }
  .hero-body { padding: 0 var(--pad) 64px; }
}

@media (max-width: 430px) {
  .coins { display: none !important; }
  .tabs { gap: 12px; }
}

/* Video de un canal externo: reproductor de la plataforma, o un aviso si no se puede reproducir aca. */
.tv-yt .yt-target, .tv-yt iframe { width: 100%; height: 100%; }
.ext-card {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 20px; text-align: center;
  color: var(--text); background: var(--surface);
}
.ext-card b { font-size: 18px; font-weight: 700; }
.ext-card span { color: var(--muted); font-size: 14px; max-width: 360px; }

/* Reels de un canal externo (TikTok): el reproductor ocupa la parte de arriba y la ficha queda debajo, sobre negro. */
/* TikTok dibuja su propia columna de likes, comentarios y compartir sobre el borde derecho del video y no deja
   ocultarla: el video deja una columna libre a la derecha para los botones de la app, asi no se pisan. */
.ext-frame { position: absolute; z-index: 2; top: var(--header); left: 0; right: 72px; bottom: 200px; background: #000; }
.ext-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.slide.external::after { display: none; }
.slide.external .tap-zone, .slide.external .big-play, .slide.external .sound-hint, .slide.external .progress { display: none; }
.slide.external .rail { bottom: 210px; right: 6px; }
/* TikTok trae su propio control de volumen. */
.slide.external .rail-btn.mute-btn { display: none; }
@media (min-width: 900px) {
  .ext-frame { top: 8px; right: 80px; bottom: 200px; border-radius: 8px; overflow: hidden; }
}

}

.st-inline { flex-direction: row !important; align-items: center; }

.st-images { margin-bottom: 26px; }

.st-row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 36px 0 14px; }
.st-projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
.st-project { display: flex; flex-direction: column; gap: 10px; }
.st-poster { position: relative; display: grid; place-items: center; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--surface); }
.st-poster img { width: 100%; height: 100%; object-fit: cover; }
.st-poster i { padding: 14px; font-size: 13px; font-style: normal; text-align: center; color: var(--muted); }

.st-project-head { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }

    if (!user?.memberPay) return charges;
    for (const [channelId, pay] of Object.entries(user.memberPay)) {
      if (pay.with !== 'trench' || pay.until > now) continue;
      const tier = channel(channelId)?.tiers.find((t) => t.level === user.memberships[channelId]);
      while (tier && pay.until <= now && user.coins >= tierTrench(tier)) {
        user.coins -= tierTrench(tier);
        pay.until += MONTH;
        charges.push({ channelId, coins: tierTrench(tier) });
      }
      if (!tier || pay.until <= now) {
        delete user.memberships[channelId];
        delete user.memberPay[channelId];
      }
    }
    return charges;
  }

  // Respuesta a "quiero ver este episodio": [estado HTTP, cuerpo]. 200 trae el video (o el id en su plataforma);
  // 401 pide entrar; 402 dice que hace falta: reason 'members' (membresia con minTier) o 'coins' (TRENCH).
  function play(user, ep) {
    if (canWatch(user, ep)) {
      if (ep.platform) return [200, { platform: ep.platform, youtubeId: ep.youtubeId, tiktokId: ep.tiktokId, me: me(user) }];
      return [200, { src: `${catalog.mediaBase}${ep.id}.mp4`, me: me(user) }];
    }
    const need = { locked: true, reason: ep.access, channelId: ep.channelId, minTier: ep.minTier, price: ep.price };
    if (!user) return [401, { ...need, loginRequired: true, me: me(user) }];
    return [402, { ...need, balance: user.coins, canAfford: ep.access === 'coins' && user.coins >= ep.price, me: me(user) }];
  }

  // Cada accion devuelve [estado HTTP, cuerpo] y cambia el usuario en el lugar; quien llama decide guardar.
  const actions = {
    unlock(user, { episodeId }) {
      const ep = episodes.get(episodeId);
      if (!ep) return [404, { error: 'Episode not found' }];
      // Los episodios de miembros no se compran con TRENCH.
      if (!canWatch(user, ep) && ep.access === 'coins' && user.coins >= ep.price) {
        user.coins -= ep.price;
        user.unlocked.push(ep.id);
      }
      return play(user, ep);
    },
    follow(user, { channelId, follow }) {
      if (!channel(channelId)) return [404, { error: 'Channel not found' }];
      user.follows = user.follows.filter((id) => id !== channelId);
      if (follow) user.follows.push(channelId);
      return [200, me(user)];
    },
    // Membresia: fija el nivel del usuario en el canal (tierId null la cancela). Unirse tambien sigue al canal.
    // pay 'card' es un pago simulado que se renueva solo; pay 'trench' cobra el mes en TRENCH ahora y se renueva
    // con el saldo cada 30 dias (settle). Cambiar de nivel con TRENCH cobra el mes del nivel nuevo.
    membership(user, { channelId, tierId, pay = 'card' }) {
      const c = channel(channelId);
      if (!c) return [404, { error: 'Channel not found' }];
      const tier = c.tiers.find((t) => t.id === tierId);
      if (tierId && !tier) return [404, { error: 'Tier not found' }];
      user.memberPay ||= {};
      if (tier) {
        if (pay === 'trench') {
          const cost = tierTrench(tier);
          if (user.coins < cost) return [402, { error: 'Not enough TRENCH', need: cost, balance: user.coins, me: me(user) }];
          user.coins -= cost;
          user.memberPay[c.id] = { with: 'trench', until: Date.now() + MONTH };
        } else {
          user.memberPay[c.id] = { with: 'card', until: null };
        }
        user.memberships[c.id] = tier.level;
        if (!user.follows.includes(c.id)) user.follows.push(c.id);
      } else {
        delete user.memberships[c.id];
        delete user.memberPay[c.id];
      }
      return [200, me(user)];
    },
    feedSeen(user) {
      user.feedSeenAt = Date.now();
      return [200, me(user)];
    },
    buyCoins(user, { packId }) {
      const pack = catalog.coinPacks.find((p) => p.id === packId);
      if (!pack) return [404, { error: 'Pack not found' }];
      user.coins += pack.coins + pack.bonus;
      return [200, me(user)];
    },
    vip(user, { planId }) {
      const plan = catalog.vipPlans.find((p) => p.id === planId);
      if (!plan) return [404, { error: 'Plan not found' }];
      user.vipUntil = Math.max(Date.now(), user.vipUntil) + plan.days * DAY;
      return [200, me(user)];
    },
    // Solo para la demo: el usuario de ejemplo vuelve a su estado de ejemplo; los demas al saldo inicial.
    reset(user) {
      if (user.email === DEMO_EMAIL) seedDemo(user);
      else Object.assign(user, { coins: catalog.startingCoins, vipUntil: 0, unlocked: [], memberships: {}, memberPay: {} });
      return [200, me(user)];
    },
  };

  // Estado del usuario de ejemplo: sigue todos los canales del catalogo, es miembro Diamond del primero
  // y tiene novedades sin ver de la ultima semana y media.
  function seedDemo(user) {
    return Object.assign(user, {
      coins: 120, vipUntil: 0,
      unlocked: [],
      follows: catalog.channels.map((c) => c.id),
      memberships: { [catalog.channels[0].id]: 2 },
      memberPay: { [catalog.channels[0].id]: { with: 'card', until: null } },
      feedSeenAt: Date.now() - 10 * DAY,
    });
  }

  // Usuario nuevo con los campos que usan las reglas.
  function newUser(fields) {
    return { coins: catalog.startingCoins, vipUntil: 0, unlocked: [], follows: [], memberships: {}, memberPay: {}, feedSeenAt: Date.now(), created: Date.now(), ...fields };
  }

  return { episodes, canWatch, feedOf, me, play, settle, actions, seedDemo, newUser };
}

const RULES = createRules(CATALOG);
const DEMO_KEY = 'tt.demo.v2';
let demoUser = null;
try { demoUser = JSON.parse(localStorage.getItem(DEMO_KEY)) || null; } catch {}
function demoSave() {
  try {
    if (demoUser) localStorage.setItem(DEMO_KEY, JSON.stringify(demoUser));
    else localStorage.removeItem(DEMO_KEY);
  } catch {}
}
const DEMO_ACTIONS = {
  '/api/unlock': 'unlock', '/api/follow': 'follow', '/api/membership': 'membership', '/api/feed/seen': 'feedSeen',
  '/api/buy-coins': 'buyCoins', '/api/vip': 'vip', '/api/reset': 'reset',
};
function demoApi(path, body = {}) {
  // Membresias pagadas con TRENCH que vencieron: se renuevan con el saldo o terminan, como en el servidor.
  if (demoUser) {
    demoUser.memberPay ||= {};
    if (RULES.settle(demoUser).length) demoSave();
  }
  if (path === '/api/catalog') return [200, CATALOG];
  if (path === '/api/me') return [200, RULES.me(demoUser)];
  if (path === '/api/feed') return [200, { items: RULES.feedOf(demoUser), me: RULES.me(demoUser) }];
  if (path.startsWith('/api/play/')) {
    const ep = RULES.episodes.get(path.slice('/api/play/'.length));
    return ep ? RULES.play(demoUser, ep) : [404, { error: 'Episode not found' }];
  }
  if (path === '/api/auth/demo') {
    demoUser = demoUser || RULES.seedDemo(RULES.newUser({ email: DEMO_EMAIL }));
    demoSave();
    return [200, RULES.me(demoUser)];
  }
  if (path === '/api/auth/logout') {
    demoUser = null;
    demoSave();
    return [200, RULES.me(null)];
  }
  if (!demoUser) return [401, { loginRequired: true, error: 'Start the demo first.', me: RULES.me(null) }];
  const action = RULES.actions[DEMO_ACTIONS[path]];
  if (!action) return [404, { error: 'Not found' }];
  const result = action(demoUser, body);
  demoSave();
  return result;
}

const tierOfLevel = (c, level) => c.tiers.find((t) => t.level === level);
// Precio mensual de un nivel en TRENCH: 100 TRENCH por dolar (la misma cuenta que hace el servidor en rules.mjs).
const trenchOfTier = (t) => Math.round(t.price * 100);
const shortDate = (ts) => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
// Como paga el usuario su membresia en un canal, en una linea.

  return 'Paid by card · renews monthly';
}
// Misma regla que el servidor: los episodios de miembros solo los abre la membresia del canal.
function isUnlocked(ep) {
  if (ep.access === 'free') return true;
  if (ep.access === 'members') return tierIn(ep.channelId) >= ep.minTier;
  return state.me.vip || state.me.unlocked.includes(ep.id) || tierIn(ep.channelId) >= 1;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtPrice = (n) => `$${n.toFixed(2)}`;
function ago(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days < 1) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return `${days} days ago`;
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// Clip de un canal externo en un slide vertical: reproductor de TikTok (o el link, si no se puede incrustar).
// Se monta solo en el slide activo y se saca al salir, para no tener varios reproductores sonando.
function mountExternal(slide, ep) {
  let box = $('.ext-frame', slide);
  if (!box) {
    box = document.createElement('div');
    box.className = 'ext-frame';
    slide.prepend(box);
  }
  slide.classList.add('external');
  if (EMBEDS_ALLOWED && ep.tiktokId) {
    box.innerHTML = `
      <iframe src="https://www.tiktok.com/player/v1/${encodeURIComponent(ep.tiktokId)}?autoplay=1&muted=1&loop=1&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=0&music_info=0&description=0&rel=0" title="TikTok video player" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
  } else {
    box.innerHTML = externalCardHtml(ep);
  }
}
// El reproductor de TikTok avisa por postMessage si no puede reproducir (por ejemplo un error del servidor de
// TikTok o un video que no se deja incrustar): en ese caso el slide pasa a mostrar el link al clip.
window.addEventListener('message', (e) => {
  if (!/^https:\/\/www\.tiktok\.com$/.test(e.origin)) return;
  let msg = e.data;
  if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
  if (!msg || !['onError', 'onPlayerError'].includes(msg.type)) return;
  const frame = [...document.querySelectorAll('.ext-frame iframe')].find((f) => f.contentWindow === e.source);
  const slide = frame?.closest('.slide');
  const ep = slide && episodeById(slide.dataset.ep || seriesById(slide.dataset.series)?.episodes[0].id);
  if (ep) frame.parentElement.innerHTML = externalCardHtml(ep, esc(ep.title), "This clip can't play right now.");
});

function unmountExternal(slide) {
  $('.ext-frame', slide)?.remove();
  slide.classList.remove('external');
}

// Un slide por video. activate() lo hace sonar y pausa al resto; el observer lo llama al quedar a la vista.
function createReel(container, slides, { onActive, onEnded } = {}) {
  let active = null;
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.6) activate(entry.target);
    }
  }, { root: container, threshold: [0.6] });

  function activate(slide) {
    if (active === slide) return;
    if (active) stop(active);
    active = slide;
    onActive?.(slide);
  }

  function stop(slide) {
    const video = $('video', slide);
    if (video) video.pause();
    if (slide.classList.contains('external')) unmountExternal(slide);
  }

  for (const slide of slides) {
    observer.observe(slide);
    const video = $('video', slide);
    video.addEventListener('timeupdate', () => {
      if (video.duration) $('.progress i', slide).style.width = `${(video.currentTime / video.duration) * 100}%`;
    });
    video.addEventListener('ended', () => onEnded?.(slide));
    video.addEventListener('play', () => slide.classList.remove('paused'));
    video.addEventListener('pause', () => slide.classList.add('paused'));
    $('.tap-zone', slide).addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) video.play().catch(() => {}); else video.pause();
    });
  }

  return {
    get active() { return active; },
    activate,
    scrollTo(slide, smooth = true) {
      slide.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', block: 'start' });
      activate(slide);
    },
    destroy() { observer.disconnect(); for (const s of slides) stop(s); },
  };
}

function playVideo(slide, src) {

}

function railHtml(s, { episodesButton = true } = {}) {
  const liked = local.read('liked', []).includes(s.id);
  const saved = local.read('mylist', []).includes(s.id);
  return `
    <div class="rail">

}

function wireRail(root) {
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const { action, series } = btn.dataset;
    if (action === 'like' || action === 'save') {
      const key = action === 'like' ? 'liked' : 'mylist';
      const set = new Set(local.read(key, []));
      if (set.has(series)) set.delete(series); else set.add(series);
      local.write(key, [...set]);
      const on = set.has(series);
      btn.classList.toggle('on', on);
      $('span', btn).textContent = action === 'like' ? (on ? 'Bullish' : 'Bullish?') : (on ? 'Watching' : 'Watchlist');
      if (action === 'save') toast(on ? 'Added to Watchlist' : 'Removed from Watchlist');
    }
    if (action === 'episodes') openEpisodeSheet(seriesById(series));
  });
}

function renderWatch(seriesId, startN) {

      <a class="back-btn" href="#/discover" aria-label="Back">${ICONS.back}</a>

        ${s.episodes.map((ep) => `

            ${slideChrome()}
            ${ep.free ? '' : `<div class="lock-layer">${lockCardHtml(ep, `data-action="unlock" data-ep="${ep.id}"`)}</div>`}
            <div class="slide-info compact">
              <h2>${esc(s.title)}</h2>
              ${byLine(s)}
              <p class="ep-line">${(ep.platform || ep.named) ? `${ep.n}. ${esc(ep.title)}` : `Episode ${ep.n} / ${s.episodes.length}`}</p>
            </div>

          </article>`).join('')}
      </div>
      <aside class="side-panel">
        <nav class="crumbs"><a href="#/channel/${s.channelId}">${esc(channelById(s.channelId).name)}</a> / <span>${esc(s.title)}</span> / <span id="crumb-ep"></span></nav>

        <div class="tag-row">${s.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        <div class="grid-host" id="grid-host"></div>
      </aside>
    </section>`;

  const reel = $('#reel');
  const slides = [...reel.querySelectorAll('.slide')];
  wireRail(reel);
  let currentN = startN;

  const refreshGrid = () => {
    $('#grid-host').innerHTML = episodeGridHtml(s, currentN);
    $('#crumb-ep').textContent = `Episode ${currentN}`;
    $('#watch-title').textContent = `Episode ${currentN} · ${s.title}`;
    for (const slide of slides) {
      const ep = s.episodes[slide.dataset.n - 1];
      slide.classList.toggle('locked', !isUnlocked(ep));
    }
  };

  async function load(slide) {
    const ep = s.episodes[slide.dataset.n - 1];
    const { status, data } = await api(`/api/play/${ep.id}`);
    if (reelCtl.active !== slide) return;
    if (status === 200) {
      slide.classList.remove('locked');
      if (data.platform) mountExternal(slide, ep); else playVideo(slide, data.src);
    } else {
      slide.classList.add('locked');
      openStore({ episode: ep, series: s });
    }
  }

  const reelCtl = createReel(reel, slides, {
    onActive(slide) {
      currentN = Number(slide.dataset.n);
      // Guarda la ruta sin disparar hashchange (no hay que re-renderizar al deslizar).
      currentHash = `#/watch/${s.id}/${currentN}`;
      const progress = local.read('progress', {});
      progress[s.id] = currentN;
      local.write('progress', progress);
      refreshGrid();
      load(slide);
    },
    onEnded(slide) {
      const next = slides[Number(slide.dataset.n)];
      if (next) reelCtl.scrollTo(next); else toast('Series complete. WAGMI.');
    },
  });

  reel.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="unlock"]');
    if (btn) openStore({ episode: s.episodes.find((x) => x.id === btn.dataset.ep), series: s });
  });
  $('#grid-host').addEventListener('click', (e) => onGridClick(e, s, reelCtl, slides));
  // Al comprar o desbloquear desde el modal: refresca candados y, si el actual ya se puede ver, lo reproduce.
  const onMe = () => {
    const slide = reelCtl.active;
    const wasLocked = slide?.classList.contains('locked');
    refreshGrid();
    if (wasLocked && !slide.classList.contains('locked')) load(slide);
  };
  document.addEventListener('me-changed', onMe);
  watchCtl = { series: s, reel: reelCtl, slides };

  reelCtl.scrollTo(slides[startN - 1] || slides[0], false);
  return {
    destroy() {
      reelCtl.destroy();
      document.removeEventListener('me-changed', onMe);
      watchCtl = null;
    },
  };
}

let watchCtl = null;

// Grilla de episodios por rangos de 30, con candado en los que no estan desbloqueados.
function episodeGridHtml(s, currentN, range = Math.floor((currentN - 1) / 30)) {
  const ranges = [];
  for (let i = 0; i < s.episodes.length; i += 30) ranges.push([i + 1, Math.min(i + 30, s.episodes.length)]);
  const [from, to] = ranges[range];
  const free = s.episodes.filter((e) => e.free).length;
  return `
    <div class="grid-head">
      <div class="ranges">${ranges.map(([a, b], i) => `<button class="${i === range ? 'on' : ''}" data-range="${i}">${a}-${b}</button>`).join('')}</div>
      <span class="grid-note">${state.me.vip ? 'Holder Pass: every episode unlocked' : `${free} free · then <i class="coin"></i>${state.catalog.episodePrice} each`}</span>
    </div>
    <div class="ep-grid">
      ${s.episodes.slice(from - 1, to).map((ep) => `
        <button class="ep-cell ${ep.n === currentN ? 'current' : ''} ${ep.n < currentN ? 'seen' : ''} ${isUnlocked(ep) ? '' : 'is-locked'}" data-n="${ep.n}">
          ${ep.n}
          ${ep.n === currentN ? '<span class="eq"><i></i><i></i><i></i></span>' : ''}
          ${lockMini(ep)}
        </button>`).join('')}
    </div>`;
}

function onGridClick(e, s, reelCtl, slides) {
  const rangeBtn = e.target.closest('[data-range]');
  if (rangeBtn) {
    const host = e.currentTarget;
    host.innerHTML = episodeGridHtml(s, reelCtl.active ? Number(reelCtl.active.dataset.n) : 1, Number(rangeBtn.dataset.range));
    return;
  }
  const cell = e.target.closest('.ep-cell');
  if (!cell) return;
  closeModal();
  const n = Number(cell.dataset.n);
  if (reelCtl && slides) reelCtl.scrollTo(slides[n - 1], false);
  else go(`#/watch/${s.id}/${n}`);
}

function openEpisodeSheet(s) {
  const currentN = watchCtl?.series.id === s.id && watchCtl.reel.active ? Number(watchCtl.reel.active.dataset.n) : resumeEpisode(s);
  showModal(`
    <div class="sheet-head">
      <img src="${s.poster}" alt="">
      <div><b>${esc(s.title)}</b><span>${s.episodes.length} episodes</span></div>
      <button class="icon-btn" data-action="close" aria-label="Close">${ICONS.close}</button>
    </div>
    <div class="grid-host" id="sheet-grid">${episodeGridHtml(s, currentN)}</div>`, 'sheet');
  $('#sheet-grid').addEventListener('click', (e) => {
    if (watchCtl?.series.id === s.id) onGridClick(e, s, watchCtl.reel, watchCtl.slides);
    else onGridClick(e, s);
  });
}

// API del reproductor de YouTube, cargada una sola vez y solo cuando hace falta (avisa si un video no se puede incrustar).
let youTubeApi = null;
function loadYouTubeApi() {
  if (!youTubeApi) {
    youTubeApi = new Promise((resolve, reject) => {
      window.onYouTubeIframeAPIReady = () => resolve(window.YT);
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = () => { youTubeApi = null; reject(new Error('YouTube API did not load')); };
      document.head.append(script);
    });
  }
  return youTubeApi;
}

const fmtTime = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// Controles propios del reproductor 16:9: play/pausa, barra para saltar, tiempo, sonido y pantalla completa.
function wireTvPlayer(el, { onEnded } = {}) {
  const video = $('video', el);
  const toggleBtn = $('[data-tv="toggle"]', el);
  const toggle = () => {
    if (!video.src) return;
    if (video.paused) video.play().catch(() => {}); else video.pause();
  };
  $('.tap-zone', el).addEventListener('click', toggle);
  toggleBtn.addEventListener('click', toggle);
  video.addEventListener('play', () => { el.classList.remove('paused'); toggleBtn.innerHTML = ICONS.pause; });
  video.addEventListener('pause', () => { el.classList.add('paused'); toggleBtn.innerHTML = ICONS.play; });
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    $('.tv-seek i', el).style.width = `${(video.currentTime / video.duration) * 100}%`;
    $('.tv-time', el).textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
  });
  video.addEventListener('ended', () => onEnded?.());
  $('.tv-seek', el).addEventListener('click', (e) => {
    if (!video.duration) return;
    const box = e.currentTarget.getBoundingClientRect();
    video.currentTime = ((e.clientX - box.left) / box.width) * video.duration;
  });
  $('[data-tv="full"]', el).addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
    else video.webkitEnterFullscreen?.();
  });
  return {
    video,
    play(src) {
      if (!video.src.endsWith(src)) video.src = src;
      video.muted = state.muted;
      video.play().catch(() => el.classList.add('paused'));
      syncMuteButtons();
    },
    // Episodio de un canal externo: lo reproduce el reproductor de YouTube, con sus propios controles.
    // Si el dueno o un reclamo de derechos no deja verlo fuera de YouTube, se ofrece abrirlo alla.
    external(ep) {
      video.pause();
      el.classList.add('external');
      const box = $('.tv-yt', el);
      box.hidden = false;
      if (!EMBEDS_ALLOWED || !ep.youtubeId) {
        box.innerHTML = externalCardHtml(ep);
        return;
      }
      const id = ep.youtubeId;
      box.innerHTML = '<div class="yt-target"></div>';
      loadYouTubeApi().then((YT) => {
        const target = $('.yt-target', box);
        if (!target) return;
        new YT.Player(target, {
          videoId: id,
          host: 'https://www.youtube-nocookie.com',
          playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0 },
          events: {
            onError() {
              if (!box.isConnected || box.hidden) return;
              box.innerHTML = externalCardHtml(ep, esc(ep.title), "This episode can't play here.");
            },
          },
        });
      }).catch(() => {
        box.innerHTML = externalCardHtml(ep, esc(ep.title), "The player didn't load.");
      });
    },
    stop() {
      el.classList.remove('external');
      const box = $('.tv-yt', el);
      box.hidden = true;
      box.innerHTML = '';
      video.pause();
      video.removeAttribute('src');
      video.load();
      $('.tv-seek i', el).style.width = '0';
      $('.tv-time', el).textContent = '0:00';
    },
    // Con un episodio bloqueado tapa el video con el sticker de desbloqueo; con null lo saca.
    lock(ep) {
      const layer = $('.tv-lock', el);
      el.classList.toggle('locked', !!ep);
      layer.hidden = !ep;
      layer.innerHTML = ep ? lockCardHtml(ep, 'data-tv="unlock"') : '';
    },
  };
}

function renderTvWatch(showId, startN) {
  const s = seriesById(showId);
  if (!s || !isTv(s)) { go('#/tv'); return null; }
  const liked = local.read('liked', []).includes(s.id);
  const saved = local.read('mylist', []).includes(s.id);

  view.innerHTML = `

        ${tvPlayerHtml(s.poster)}
        <div class="tv-meta">
          <nav class="crumbs"><a href="#/tv">TV</a> / <a href="#/channel/${c.id}">${esc(c.name)}</a> / <span>${esc(s.title)}</span></nav>
          <h1 id="tv-title"></h1>

          </div>
          <div class="tag-row"><span class="chip ticker">${esc(s.ticker)}</span>${s.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
          <p class="synopsis">${esc(s.synopsis)}</p>
          ${c.external ? `<p class="ext-note">Example channel, not affiliated with ${esc(c.name)}. Episodes play from ${c.external.platform}. <a href="${c.external.url}" target="_blank" rel="noopener">Open the channel on ${c.external.platform}</a></p>` : ''}
        </div>
      </div>
      <aside class="tv-list">
        <div class="tv-list-head"><b>Episodes</b><span class="grid-note">${c.external ? `Free on ${c.external.platform}` : `${free} free · then <i class="coin"></i>${state.catalog.episodePrice} each`}</span></div>
        <div id="tv-eps"></div>
      </aside>
    </section>`;

  let currentN = startN;
  const listEl = $('#tv-eps');
  const playerEl = $('.tv-player', view);

  const refresh = () => {
    const cur = s.episodes[currentN - 1];
    $('#tv-title').textContent = (cur.platform || cur.named) ? cur.title : `Episode ${currentN} · ${s.title}`;
    listEl.innerHTML = s.episodes.map((ep) => `
      <button class="tv-ep ${ep.n === currentN ? 'current' : ''} ${isUnlocked(ep) ? '' : 'is-locked'}" data-n="${ep.n}">
        <span class="tv-ep-thumb">
          <img src="${ep.thumb || s.poster}" alt="" loading="lazy">
          ${lockMini(ep)}
          ${ep.n === currentN ? '<span class="eq"><i></i><i></i><i></i></span>' : ''}

        <span class="tv-ep-text"><b>${(ep.platform || ep.named) ? `${ep.n}. ${esc(ep.title)}` : `Episode ${ep.n}`}</b><small>${accessLabel(ep)}</small></span>
      </button>`).join('');
  };

  async function show(n) {
    currentN = n;
    const ep = s.episodes[n - 1];
    currentHash = `#/tv/${s.id}/${n}`;
    const progress = local.read('progress', {});
    progress[s.id] = n;
    local.write('progress', progress);
    refresh();
    player.stop();
    const { status, data } = await api(`/api/play/${ep.id}`);
    if (currentN !== n) return;
    if (status === 200) {
      player.lock(null);
      if (data.platform) player.external(ep); else player.play(data.src);
    } else {
      player.lock(ep);
      openStore({ episode: ep, series: s });
    }
  }

  const player = wireTvPlayer(playerEl, {
    onEnded() {
      if (currentN < s.episodes.length) show(currentN + 1); else toast('Season complete. WAGMI.');
    },
  });
  playerEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-tv="unlock"]')) openStore({ episode: s.episodes[currentN - 1], series: s });
  });
  listEl.addEventListener('click', (e) => {
    const item = e.target.closest('.tv-ep');
    if (item) show(Number(item.dataset.n));
  });
  wireRail($('.tv-actions', view));
  // Al comprar o desbloquear desde el modal: refresca la lista y, si el actual ya se puede ver, lo reproduce.
  const onMe = () => {
    const wasLocked = playerEl.classList.contains('locked');
    refresh();
    if (wasLocked && isUnlocked(s.episodes[currentN - 1])) show(currentN);
  };
  document.addEventListener('me-changed', onMe);

  show(Math.min(startN, s.episodes.length));
  return {
    destroy() {
      player.video.pause();
      document.removeEventListener('me-changed', onMe);
    },
  };
}

async function joinTier(channelId, tierId, pay = 'card') {
  const c = channelById(channelId);
  const tier = c.tiers.find((t) => t.id === tierId);
  if (!state.me.user) {
    return openAuth({ reason: `Start the demo to join ${c.name} as ${tier.name}.`, then: () => joinTier(channelId, tierId, pay) });
  }
  const { status, data } = await api('/api/membership', { channelId, tierId, pay });
  if (status === 402) {
    toast(`${tier.name} costs ${data.need} TRENCH a month. You have ${data.balance}.`);
    return openStore();
  }
  if (status !== 200) return toast('Could not join right now. Try again.');
  setMe(data);
  if (document.querySelector('.modal.store')) closeModal();
  toast(pay === 'trench' ? `You're a ${tier.name} member of ${c.name} · ${trenchOfTier(tier)} TRENCH paid` : `You're a ${tier.name} member of ${c.name}`);
}

async function cancelTier(channelId) {
  const { status, data } = await api('/api/membership', { channelId, tierId: null });
  if (status !== 200) return;
  setMe(data);
  toast('Membership canceled');
}

async function toggleFollow(c) {
  if (!state.me.user) return openAuth({ reason: `Start the demo to follow ${c.name}.`, then: () => toggleFollow(c) });
  const follow = !state.me.follows.includes(c.id);
  const { data } = await api('/api/follow', { channelId: c.id, follow });
  setMe(data);
  toast(follow ? `Following ${c.name}. New episodes land in your feed.` : `Unfollowed ${c.name}`);
}

function renderChannel(channelId) {
  const c = channelById(channelId);
  if (!c) { go('#/discover'); return null; }
  const shows = state.catalog.series.filter((s) => s.channelId === c.id);
  const membersEps = shows.flatMap((s) => s.episodes.filter((ep) => ep.access === 'members').map((ep) => [s, ep]));

    <section class="channel-page" style="--accent:${c.color}">

          ${c.links && Object.keys(c.links).length ? `<p class="ch-links">${Object.entries(c.links).map(([k, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${({ x: 'X', tiktok: 'TikTok', youtube: 'YouTube', website: 'Website' })[k]}</a>`).join('')}</p>` : ''}

      <h3 class="shelf-title">Shows</h3>
      ${shows.length ? `<div class="shelf">${shows.map((s) => cardHtml(s, `${s.episodes.length} eps`)).join('')}</div>` : '<p class="empty-note">No shows yet.</p>'}
      <h3 class="shelf-title" id="membership">Membership</h3>
      <div class="tier-host" id="tier-host"></div>
      ${membersEps.length ? '<h3 class="shelf-title">Members only</h3><div class="shelf" id="members-shelf"></div>' : ''}
    </section>`;
  // Si el canal es del creador que esta mirando, en vez de seguir y unirse ve el acceso a su Studio.
  let mine = false;
  if (STUDIO_ENABLED && c.creator && state.me.user) {
    fetch('/api/studio').then((r) => r.json()).then((d) => { mine = d.channel?.id === c.id; if (mine) refresh(); }).catch(() => {});
  }
  const refresh = () => {
    const following = state.me.follows.includes(c.id);
    const tier = tierIn(c.id);
    $('#ch-actions').innerHTML = mine ? '<a class="ghost" href="#/studio">Open Creator Studio</a>' : `
      <button class="ghost" data-ch="follow">${following ? 'Following' : 'Follow'}</button>
      ${tier ? `<span class="chip member-chip">${esc(tierOfLevel(c, tier).name)} member</span>` : '<button class="primary join" data-ch="join">Join</button>'}`;
    $('#tier-host').innerHTML = tiersHtml(c);

    if (btn.dataset.ch === 'follow') toggleFollow(c);

  refresh();
  return {
    destroy() {
      view.removeEventListener('click', onClick);
      document.removeEventListener('me-changed', refresh);
    },
  };
}

function openStore({ episode = null, series = null } = {}) {

  }
  if (episode?.access === 'members') return openMembership(channelById(episode.channelId), { episode });
  const render = () => {
    const price = episode?.price ?? 0;
    const affordable = episode && state.me.coins >= price;
    return `
      <div class="store-head">
        ${episode ? `<span>Price <b><i class="coin"></i>${price}</b></span><span class="sep"></span>` : ''}
        <span>Balance <b><i class="coin"></i>${state.me.coins.toLocaleString('en-US')}</b></span>
        <button class="icon-btn" data-action="close" aria-label="Close">${ICONS.close}</button>
      </div>
      ${episode ? `
        <div class="unlock-box ${affordable ? '' : 'short'}">
          <div>
            <b>${esc(series.title)} · Episode ${episode.n}</b>
            <span>${affordable ? 'You have enough TRENCH to unlock this episode.' : `You need ${price - state.me.coins} more TRENCH.`}</span>
          </div>
          <button class="primary" data-action="spend" ${affordable ? '' : 'disabled'}>Unlock for <i class="coin"></i>${price}</button>
        </div>` : ''}
      <h4>Holder Pass · Unlock every series</h4>
      <p class="sub">Unlimited viewing, no ads, 1080p.</p>
      <div class="vip-grid">
        ${state.catalog.vipPlans.map((p) => `
          <button class="vip-card" data-vip="${p.id}">
            ${p.tag ? `<span class="badge">${p.tag}</span>` : ''}
            <span class="vip-name">${p.name}</span>
            <b>${fmtPrice(p.price)}</b>
            <span class="vip-note">${p.note}</span>
          </button>`).join('')}
      </div>
      <h4>Buy TRENCH</h4>
      <div class="coin-grid">
        ${state.catalog.coinPacks.map((p) => `
          <button class="coin-card" data-pack="${p.id}">
            ${p.bonus ? `<span class="badge">+${Math.round((p.bonus / p.coins) * 100)}%</span>` : ''}
            <span class="coin-stack"><i class="coin big"></i></span>
            <span class="coin-amt">${p.coins.toLocaleString('en-US')}${p.bonus ? ` <em>+ ${p.bonus.toLocaleString('en-US')}</em>` : ''}</span>
            <span class="coin-price">${fmtPrice(p.price)}</span>
          </button>`).join('')}
      </div>
      ${WALLET_ENABLED ? `
        <h4>Pay with SOL <span class="chip hot">Devnet test</span></h4>
        <p class="sub">${state.me.user.wallet
          ? `Uses free devnet SOL from ${esc(shortAddr(state.me.user.wallet))}: no real money moves. Get test SOL at <a href="https://faucet.solana.com" target="_blank" rel="noopener">faucet.solana.com</a>.`
          : 'Connect a Solana wallet to pay with free devnet SOL. No real money moves.'}</p>
        ${state.me.user.wallet ? `<div class="sol-grid" data-sol-grid><p class="sub">Loading devnet prices…</p></div>` : '<button class="ghost" data-wallet="link">Connect Solana wallet</button>'}` : ''}
      <p class="test-note">Test mode: no real payment is made. TRENCH are in-app credits, not a token on any chain.</p>`;
  };

  const box = showModal(render(), 'store');
  // Precios de los packs en SOL de devnet (los da el servidor junto con la tesoreria de prueba).
  let payInfo = null;
  const fillSol = async () => {
    const grid = $('[data-sol-grid]', box);
    if (!grid) return;
    payInfo ||= await fetch('/api/wallet/pay-info').then((r) => r.json());
    grid.innerHTML = payInfo.packs.map((p) => `
      <button class="sol-card" data-sol-pack="${p.id}"><b><i class="coin"></i>${p.coins.toLocaleString('en-US')}</b><span>${(p.lamports / 1e9).toFixed(4)} SOL</span></button>`).join('');
  };
  const rerender = () => { box.innerHTML = render(); fillSol(); };
  fillSol();

  async function spend() {
    const { status } = await api('/api/unlock', { episodeId: episode.id });
    if (status !== 200) return rerender();
    closeModal();
    toast(`LFG. Episode ${episode.n} unlocked · -${episode.price} TRENCH`);
  }

  box.addEventListener('click', async (e) => {
    const target = e.target.closest('button');
    if (!target) return;
    if (target.dataset.action === 'spend') return spend();
    if (target.dataset.solPack) {
      const pack = payInfo.packs.find((p) => p.id === target.dataset.solPack);
      const w = (await walletLib()).installed()[0];
      if (!w) return toast('Open this page in a browser with Phantom, Solflare or Backpack.');
      target.disabled = true;
      target.classList.add('busy');
      try {
        toast('Approve the devnet transfer in your wallet…');
        const signature = await (await walletLib()).paySol(w.id, { from: state.me.user.wallet, to: payInfo.treasury, lamports: pack.lamports, rpc: payInfo.rpc });
        toast('Checking the transaction on devnet…');
        const { status, data } = await api('/api/wallet/pay', { packId: pack.id, signature });
        if (status !== 200) throw new Error(data.error);
        toast(`+${pack.coins.toLocaleString('en-US')} TRENCH added · paid with devnet SOL`);
        if (episode && state.me.coins >= episode.price) return spend();
        rerender();
      } catch (err) {
        toast(err.message || 'The payment did not go through.');
        target.disabled = false;
        target.classList.remove('busy');
      }
      return;
    }
    if (target.dataset.vip) {
      await api('/api/vip', { planId: target.dataset.vip }).then(({ data }) => setMe(data));
      closeModal();
      toast('Holder Pass active · every episode unlocked');
      return;
    }
    if (target.dataset.pack) {
      const pack = state.catalog.coinPacks.find((p) => p.id === target.dataset.pack);
      await api('/api/buy-coins', { packId: pack.id }).then(({ data }) => setMe(data));
      toast(`+${(pack.coins + pack.bonus).toLocaleString('en-US')} TRENCH added`);
      // Como en la app real: si la compra vino del candado y ya alcanza, desbloquea solo.
      if (episode && state.me.coins >= episode.price) return spend();
      rerender();
    }
  });
}

// ---------- Wallets de Solana ----------
// Elige la wallet instalada (o muestra donde bajarla), firma el mensaje del servidor y hace lo que pide `purpose`:
// 'login' entra o crea la cuenta, 'link' la suma a la cuenta abierta, 'payout' es la wallet de cobro del creador.
async function walletPicker(purpose, then = null) {
  const lib = await walletLib();
  const title = { login: 'Continue with a Solana wallet', link: 'Connect a Solana wallet', payout: 'Payout wallet' }[purpose];
  const box = showModal(`
    <div class="auth-head">
      <img src="/icon.svg" alt="">
      <button class="icon-btn" data-action="close" aria-label="Close">${ICONS.close}</button>
    </div>
    <h3>${title}</h3>
    <p class="sub">${purpose === 'payout' ? 'Your earnings would be sent to this wallet. ' : ''}You'll sign a message to prove the wallet is yours. Signing doesn't move funds or cost gas.</p>
    <div class="wallet-list">
      ${lib.WALLETS.map((w) => w.get()
        ? `<button class="wallet-opt" data-pick="${w.id}"><b>${w.name}</b><span>Detected</span></button>`
        : `<a class="wallet-opt off" href="${w.url}" target="_blank" rel="noopener"><b>${w.name}</b><span>Install</span></a>`).join('')}
    </div>
    <p class="form-error" role="alert"></p>`, 'auth');
  box.addEventListener('click', async (e) => {
    const pick = e.target.closest('[data-pick]');
    if (!pick) return;
    const err = $('.form-error', box);
    err.textContent = '';
    pick.classList.add('busy');
    try {
      const signed = await lib.connectAndSign(pick.dataset.pick, purpose);
      const path = { login: '/api/wallet/login', link: '/api/wallet/link', payout: '/api/wallet/payout' }[purpose];
      const { status, data } = await api(path, { nonce: signed.nonce, signature: signed.signature });
      if (status !== 200) throw new Error(data.error || 'Something went wrong.');
      if (purpose !== 'payout') setMe(data);
      closeModal();
      if (purpose === 'login') toast(data.created ? `Welcome to the trenches · ${data.coins} free TRENCH` : `gm, ${shortAddr(signed.address)}`);
      if (purpose === 'link') toast(`Wallet ${shortAddr(signed.address)} linked`);
      if (purpose === 'payout') toast(`Payouts would go to ${shortAddr(signed.address)}`);
      then?.(data);
      if (purpose !== 'login' || !then) route();
    } catch (ex) {
      err.textContent = ex.code === 4001 || /reject/i.test(ex.message) ? 'You declined in the wallet.' : ex.message;
    } finally {
      pick.classList.remove('busy');
    }
  });
}

// ---------- Router y acciones globales ----------

let current = null;

function route() {
  current?.destroy?.();
  current = null;
  closeModal();
  window.scrollTo(0, 0);
  const parts = currentHash.replace(/^#\/?/, '').split('/');
  let tab = 'feed';
  if (parts[0] === 'watch') {
    tab = 'watch';
    current = renderWatch(parts[1], Math.max(1, Number(parts[2]) || 1));
  } else if (parts[0] === 'tv') {
    tab = 'tv';
    current = parts[1] ? renderTvWatch(parts[1], Math.max(1, Number(parts[2]) || 1)) : renderTvHome();
  } else if (parts[0] === 'feed') {
    tab = 'following';
    renderFeedPage();
  } else if (parts[0] === 'channel') {
    tab = 'channel';
    current = renderChannel(parts[1]);
  } else if (parts[0] === 'discover') {
    tab = 'discover';
    renderDiscover();
  } else if (parts[0] === 'studio' && STUDIO_ENABLED) {
    tab = 'studio';
    current = mountStudio(parts.slice(1));
  } else {
    current = renderFeed();
  }
  document.body.dataset.view = tab;
  document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === (tab === 'watch' ? 'feed' : tab)));
  syncMuteButtons();
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action } = btn.dataset;
  if (action === 'close') closeModal();
  if (action === 'store') openStore();
  if (action === 'account') openAccount();
  if (action === 'demo-login') loginDemo();
  const walletBtn = e.target.closest('[data-wallet]');
  if (walletBtn?.dataset.wallet === 'link') walletPicker('link');
  if (walletBtn?.dataset.wallet === 'unlink') {
    const { status, data } = await api('/api/wallet/unlink', {});
    if (status === 200) { toast('Wallet unlinked'); openAccount(); } else toast(data.error);
  }
  if (action === 'mute') { e.stopPropagation(); toggleMute(); }
  if (action === 'logout') {
    await api('/api/auth/logout', {}).then(({ data }) => setMe(data));
    toast('gn, anon');
    route();
  }
  if (action === 'reset') {
    if (state.me.user) await api('/api/reset', {}).then(({ data }) => setMe(data));
    ['progress', 'liked', 'mylist'].forEach((k) => local.write(k, k === 'progress' ? {} : []));
    toast('Demo reset');
    route();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (!['ArrowDown', 'ArrowUp'].includes(e.key) || document.body.classList.contains('has-modal')) return;
  const reel = $('#reel');
  if (!reel) return;
  e.preventDefault();
  reel.scrollBy({ top: (e.key === 'ArrowDown' ? 1 : -1) * reel.clientHeight, behavior: 'smooth' });
});

// Botones de membresia (en la pagina del canal y en el modal): unirse, cambiar de nivel o cancelar.
document.addEventListener('click', (e) => {
  const tierBtn = e.target.closest('[data-tier]');
  if (tierBtn) joinTier(tierBtn.dataset.channel, tierBtn.dataset.tier, tierBtn.dataset.pay);
  const cancelBtn = e.target.closest('[data-cancel]');
  if (cancelBtn) cancelTier(cancelBtn.dataset.cancel);
});

// Los links internos (#/...) cambian la ruta en memoria.
document.addEventListener('click', (e) => {
  const link = e.target.closest('a[href^="#/"]');
  if (!link) return;
  e.preventDefault();
  go(link.getAttribute('href'));
});

function setCatalog(catalog) {
  state.catalog = catalog;
  state.episodes = new Map();
  // Cada episodio sabe de que serie y canal es (los candados y el feed lo necesitan).
  for (const s of catalog.series) {
    for (const ep of s.episodes) {
      Object.assign(ep, { seriesId: s.id, channelId: s.channelId });
      state.episodes.set(ep.id, ep);
    }
  }
}

// El Studio vive en su propio archivo y se carga recien cuando se abre. Recibe lo que necesita de la app.
function mountStudio(parts) {
  let mod = null;
  let gone = false;
  view.innerHTML = '<section class="studio"><p class="empty-note">Loading Creator Studio…</p></section>';
  import('./studio.js').then((m) => {
    if (gone) return;
    mod = m.renderStudio(parts, {
      api, state, view, $, esc, toast, openAuth, channelAvatar, fmtPrice, ICONS, walletPicker: WALLET_ENABLED ? walletPicker : null, shortAddr,
      // Despues de publicar o cambiar algo, la app vuelve a pedir el catalogo para mostrarlo.
      refreshCatalog: async () => setCatalog((await api('/api/catalog')).data),
    });
  });
  return { destroy() { gone = true; mod?.destroy?.(); } };
}

const [{ data: catalog }, { data: me }] = await Promise.all([api('/api/catalog'), api('/api/me')]);
setCatalog(catalog);
setMe(me);
route();

</script>
